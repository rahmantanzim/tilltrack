name: CI

on:
  pull_request:
  push:
    branches: [main]

# If a new commit is pushed to the same branch, stop the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow can only read the code, nothing else.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build